x-api: &api
  image: rinha-backend-api
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=RinhaBackend;User Id=sa;Password=SqlServer123!;TrustServerCertificate=True;
  depends_on:
    db-init:
      condition: service_completed_successfully

services:
  api1:
    <<: *api
    container_name: rinha_api1

  api2:
    <<: *api
    container_name: rinha_api2

  nginx:
    image: nginx:1.27-alpine
    container_name: rinha_nginx
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: SqlServer123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: rinha_db_init
    depends_on:
      - sqlserver
    volumes:
      - ./database/init.sql:/init.sql:ro
    command: >
      /bin/bash -c "
      until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'SqlServer123!' -Q 'SELECT 1' -b -C; do
        sleep 1;
      done;
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'SqlServer123!' -i /init.sql -b -C
      "

volumes:
  mssql_data:
